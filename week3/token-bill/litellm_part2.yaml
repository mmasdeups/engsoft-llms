# Part 2 - both roads, one model, one meter.
#
#   export GEMINI_API_KEY=AIza...
#   cd week3/token-bill
#   PYTHONPATH="$PWD" METER_LOG=cli-road.jsonl \
#       litellm --config litellm_part2.yaml --port 4000
#
# Restart with METER_LOG=browser-road.jsonl before the second road so the two
# totals never mix.
#
# Uses Google AI Studio (free-tier) Gemini. If you have an OpenRouter key
# instead, swap the two litellm_params lines for:
#     model: openrouter/openai/gpt-4.1-mini
#     api_key: os.environ/OPENROUTER_API_KEY

model_list:
  - model_name: meter
    litellm_params:
      model: gemini/gemini-2.5-flash
      api_key: os.environ/GEMINI_API_KEY

litellm_settings:
  callbacks: token_meter.proxy_handler_instance
  drop_params: true
